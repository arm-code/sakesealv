# Stack self-host de Sake: app + migrador + SeaweedFS (S3) + libSQL en archivo.
# Defaults en ./.env.docker.selfhosted.
#   docker compose up --build
services:
  sake:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runtime
      args:
        PUBLIC_WEBAPP_VERSION: dev-selfhost-next
    image: sake
    container_name: sake-selfhost
    ports:
      - "5173:3000"
    env_file:
      - ./.env.docker.selfhosted
    volumes:
      - ./.data/selfhost/libsql:/data
      - ./koreaderPlugins/sake.koplugin:/app/koreaderPlugins/sake.koplugin:ro
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      sake-migrator:
        condition: service_completed_successfully

  sake-migrator:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrator
    image: sake-migrator
    container_name: sake-migrator-selfhost
    env_file:
      - ./.env.docker.selfhosted
    volumes:
      - ./.data/selfhost/libsql:/data
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.17
    container_name: sake-seaweedfs
    env_file:
      - ./.env.docker.selfhosted
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mkdir -p /etc/seaweedfs
        SEAWEEDFS_ACCESS_KEY="$${S3_ACCESS_KEY_ID:?missing S3_ACCESS_KEY_ID}"
        SEAWEEDFS_SECRET_KEY="$${S3_SECRET_ACCESS_KEY:?missing S3_SECRET_ACCESS_KEY}"
        cat >/etc/seaweedfs/s3.conf <<EOF
        {
          "identities": [
            {
              "name": "sake",
              "credentials": [
                {
                  "accessKey": "$$SEAWEEDFS_ACCESS_KEY",
                  "secretKey": "$$SEAWEEDFS_SECRET_KEY"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.conf
    environment:
      WEED_SERVER_VOLUME_MAX: 0
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - ./.data/selfhost/seaweedfs:/data

  # Crea el bucket S3 en SeaweedFS. Usa el mismo SDK que la app (imagen del migrador),
  # en vez del CLI de AWS: una imagen menos y sin binarios externos.
  seaweedfs-init:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrator
    image: sake-migrator
    container_name: sake-seaweedfs-init
    env_file:
      - ./.env.docker.selfhosted
    depends_on:
      seaweedfs:
        condition: service_started
    command: ["node", "scripts/ensure-bucket.mjs"]
    restart: "no"
