# Stack de Sake para Coolify (recurso "Docker Compose", este archivo).
#   app + migrador + sqld (libSQL por HTTP) + SeaweedFS (S3).
#
# Diferencias con docker-compose.yaml (self-host local):
#   - Las variables se capturan en la pantalla de Coolify (no hay env_file).
#   - Sin puertos del host ni container_name: el proxy de Coolify llega al servicio `sake`
#     por la red interna (dominio -> servicio `sake`, puerto 3000).
#   - Datos en volúmenes con nombre (sobreviven a los redespliegues).
#
# Volúmenes que NO se pueden perder: sqld (base de datos) y seaweedfs (los libros).
# Variables obligatorias: S3_ACCESS_KEY_ID y S3_SECRET_ACCESS_KEY (inventa dos valores
# largos y aleatorios; SeaweedFS las usa para crear el acceso S3 al arrancar).
# El resto tiene valores por defecto (ver .env.example).

services:
  sake:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runtime
      args:
        PUBLIC_WEBAPP_VERSION: ${PUBLIC_WEBAPP_VERSION:-coolify}
    restart: unless-stopped
    environment: &app-env
      LIBSQL_URL: ${LIBSQL_URL:-http://sqld:8080}
      LIBSQL_AUTH_TOKEN: ${LIBSQL_AUTH_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sake}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Define S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Define S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ACTIVATED_PROVIDERS: ${ACTIVATED_PROVIDERS:-}
      ZLIBRARY_BASE_URL: ${ZLIBRARY_BASE_URL:-}
      ACTIVATED_METADATA_PROVIDERS: ${ACTIVATED_METADATA_PROVIDERS:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      ISBNDB_API_KEY: ${ISBNDB_API_KEY:-}
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
      METADATA_PROVIDER_TIMEOUT_MS: ${METADATA_PROVIDER_TIMEOUT_MS:-}
    depends_on:
      sqld:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
      sake-migrator:
        condition: service_completed_successfully
    expose:
      - "3000"

  # Aplica las migraciones de la base y termina.
  sake-migrator:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrator
    restart: "no"
    environment: *app-env
    depends_on:
      sqld:
        condition: service_started

  # Base de datos: servidor libSQL (sqld). La app habla con él por HTTP.
  # Se usa un servidor en lugar de `file:` porque el binario nativo de libsql que abre
  # archivos locales muere con "Illegal instruction" en CPUs viejos (sin SSE4.2/AVX2),
  # y sqld sí corre en ellos. Imagen fijada por digest: es la que se probó en ese CPU.
  sqld:
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    restart: unless-stopped
    volumes:
      - sqld:/var/lib/sqld

  seaweedfs:
    image: chrislusf/seaweedfs:4.17
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mkdir -p /etc/seaweedfs
        SEAWEEDFS_ACCESS_KEY="$${S3_ACCESS_KEY_ID:?missing S3_ACCESS_KEY_ID}"
        SEAWEEDFS_SECRET_KEY="$${S3_SECRET_ACCESS_KEY:?missing S3_SECRET_ACCESS_KEY}"
        cat >/etc/seaweedfs/s3.conf <<EOF
        {
          "identities": [
            {
              "name": "sake",
              "credentials": [
                {
                  "accessKey": "$$SEAWEEDFS_ACCESS_KEY",
                  "secretKey": "$$SEAWEEDFS_SECRET_KEY"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.conf
    environment:
      WEED_SERVER_VOLUME_MAX: 0
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Define S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Define S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs:/data

  # Crea el bucket S3 en SeaweedFS (mismo SDK que la app) y termina.
  seaweedfs-init:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrator
    restart: "no"
    environment: *app-env
    depends_on:
      seaweedfs:
        condition: service_started
    command: ["node", "scripts/ensure-bucket.mjs"]

volumes:
  sqld:
  seaweedfs:
